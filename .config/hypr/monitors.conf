# Shared monitor rules, loaded by hyprland.conf.
# Baseline mode. display_power.py applies the 60 Hz power-saver override after
# startup/config reload; the switcher also respects that override on hotplug.
monitor = eDP-1,1920x1200@144,0x0,1

# Use each external display's advertised preferred mode, not a fixed 144 Hz.
monitor = HDMI-A-1,preferred,1920x0,1
# Automatically enable other connected outputs to the right.
monitor = ,preferred,auto,1
