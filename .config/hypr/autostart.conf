# Start the xdg portal services (for wayland)
exec-once = /usr/lib/xdg-desktop-portal
exec-once = /usr/lib/xdg-desktop-portal-hyprland
env = GTK_USE_PORTAL,1

# GTK/portal appearance and the shared Qt 5/6 palette.
env = QT_QPA_PLATFORMTHEME,qt5ct
exec-once = /usr/bin/python3 ~/dotfiles/scripts/apply_app_theme.py --session

# Choose the best advertised display modes at login and on HDMI/DP hotplug.
exec-once = /usr/bin/python3 ~/dotfiles/scripts/watch_displays.py


# Wifi and Bluetooth
exec-once = nm-applet --indicator
exec-once = blueman-applet

# bar 
exec-once = qs &
# exec-once = mako
# exec-once = swaync

# Wallpaper loader
exec-once = awww-daemon &
exec-once = awww img ~/.config/hypr/hyprlock/background.jpg

# Fcitx5
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
exec-once = fcitx5 -d --replace

